<!DOCTYPE html>
<html lang="en">
<head>

    <title>Student Report</title>
</head>
<body>

    <h1>ABC International School</h1>

    <h2>Student Report</h2>

    <table border="1">
        <tr>
            <th rowspan="2" title="Student information">Student</th>
            <th colspan="5" title="Marks obtained in subjects">Subjects</th>
        </tr>

        <tr>
            <th>English</th>
            <th>Mathematics</th>
            <th>Science</th>
            <th>Computer</th>
            <th>Physics</th>
        </tr>

        <tr>
            <td>Shiva Singh</td>
            <td>85</td>
            <td>92</td>
            <td>88</td>
            <td>95</td>
            <td>90</td>
        </tr>

        <!-- Total and percentage row -->
        <tr>
            <td colspan="3">Total: 450</td>
            <td colspan="3">Percentage: 90%</td>
        </tr>
    </table>

    <p title="This is the student's final percentage.">
        Final Percentage: 90%
    </p>

</body>
</html>
