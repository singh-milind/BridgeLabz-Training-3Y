<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>
<body>

    <h1>Choose Your Travel Destination</h1>

    <!-- Country selection -->
    <label for="country">Country:</label>

    <select id="country">
        <option selected>India</option>
        <option>Japan</option>
        <option>France</option>
        <option>United Arab Emirates</option>
    </select>

    <br><br>

    <!-- State selection -->
    <label for="state">State:</label>

    <select id="state">
        <option selected>Haryana</option>
        <option>Delhi</option>
        <option>Rajasthan</option>
        <option>Maharashtra</option>
    </select>

    <br><br>

    <!-- City selection -->
    <label for="city">City:</label>

    <select id="city">
        <option selected>Gurugram</option>
        <option>New Delhi</option>
        <option>Jaipur</option>
        <option>Mumbai</option>
    </select>

    <br><br>

    <!-- Tourist place selection -->
    <label for="place">Favorite Tourist Place:</label>

    <select id="place">
        <option selected>India Gate</option>
        <option>Taj Mahal</option>
        <option>Gateway of India</option>
        <option>Amber Fort</option>
    </select>

    <!-- Summary -->
    <p>
        My selected destination is India, Haryana, Gurugram,
        and my favorite tourist place is India Gate.
    </p>

</body>
</html>
