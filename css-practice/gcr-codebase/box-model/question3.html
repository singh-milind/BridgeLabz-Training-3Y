<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Backgrounds</title>
    <link rel="stylesheet" href="question3.css">
</head>
<body>
    <header>
        <h1>CSS Gradient Showcase</h1>
    </header>

    <main>
        <section class="gradient-section linear">
            <div>
                <h2>Linear Gradient</h2>
                <p>
                    A linear gradient transitions smoothly between
                    colors along a straight line.
                </p>
            </div>
        </section>

        <section class="gradient-section radial">
            <div>
                <h2>Radial Gradient</h2>
                <p>
                    A radial gradient spreads colors outward from
                    a central point.
                </p>
            </div>
        </section>
    </main>

    <footer>
        <p>CSS Gradient Demonstration</p>
    </footer>
</body>
</html>
