<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="question2.css">
</head>
<body>
    <header>
        <h1>Height & Width Practice</h1>
    </header>

    <main>
        <section class="box-container">
            <article class="box box-one">
                <h2>Fixed Size</h2>
                <p>Height: 150px<br>Width: 200px</p>
            </article>

            <article class="box box-two">
                <h2>Responsive Size</h2>
                <p>Width: 35%<br>Height: 20vh</p>
            </article>

            <article class="box box-three">
                <h2>EM & Overflow</h2>
                <p>
                    This box demonstrates em sizing,
                    max-width, min-height and overflow.
                    Extra content is clipped when it exceeds
                    the available height.
                </p>
            </article>
        </section>
    </main>

    <footer>
        <p>CSS Dimension Practice</p>
    </footer>
</body>
</html>
