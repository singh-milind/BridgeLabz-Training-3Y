<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="question3.css">
</head>
<body>

    <header>
        <h1>Image Showcase</h1>
        <p>Hover over an image to see the visual effect.</p>
    </header>

    <main>
        <section class="gallery">

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="image1.jpg" alt="Nature landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Nature</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="image2.jpg" alt="Mountain landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Mountains</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="image3.jpg" alt="Forest landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Forest</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="image4.jpg" alt="Ocean landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Ocean</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="image5.jpg" alt="City view">
                    <div class="overlay"></div>
                </div>
                <figcaption>City</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="image6.jpg" alt="Sunset landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Sunset</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>CSS Image Showcase Practice</p>
    </footer>

</body>
</html>
