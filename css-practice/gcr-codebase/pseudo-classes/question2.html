<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>
    <link rel="stylesheet" href="question2.css">
</head>
<body>

    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over each element to display its tooltip.</p>
    </header>

    <main>
        <section class="tooltip-container">

            <article class="tooltip-item">
                <span class="icon">★</span>
                <span class="tooltip-text">This is a star icon</span>
                <p>Star</p>
            </article>

            <article class="tooltip-item">
                <span class="icon">?</span>
                <span class="tooltip-text">This provides help information</span>
                <p>Help</p>
            </article>

            <article class="tooltip-item">
                <span class="icon">!</span>
                <span class="tooltip-text">This indicates an important message</span>
                <p>Alert</p>
            </article>

            <article class="tooltip-item">
                <span class="icon">✓</span>
                <span class="tooltip-text">This indicates successful completion</span>
                <p>Success</p>
            </article>

        </section>
    </main>

    <footer>
        <p>CSS Tooltip Practice</p>
    </footer>

</body>
</html>
