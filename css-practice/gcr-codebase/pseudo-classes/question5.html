<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="question5.css">
</head>
<body>

    <header>
        <h1>Styled Button Collection</h1>
        <p>Different button styles and CSS pseudo-classes.</p>
    </header>

    <main>
        <section class="button-container">

            <article class="button-card">
                <h2>Primary</h2>
                <button class="btn primary">Primary Button</button>
                <p>Hover and click the button.</p>
            </article>

            <article class="button-card">
                <h2>Secondary</h2>
                <button class="btn secondary">Secondary Button</button>
                <p>Focus the button using the keyboard.</p>
            </article>

            <article class="button-card">
                <h2>Outline</h2>
                <button class="btn outline">Outline Button</button>
                <p>Hover to see the transition.</p>
            </article>

            <article class="button-card">
                <h2>Disabled</h2>
                <button class="btn disabled" disabled>Disabled Button</button>
                <p>This button cannot be clicked.</p>
            </article>

        </section>
    </main>

    <footer>
        <p>CSS Button Styling Practice</p>
    </footer>

</body>
</html>
